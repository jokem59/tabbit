[package]
name = "tabbit"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26.1"
crossterm = "0.27.0"
anyhow = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
nom = "7.1"
notify = "6.1"
itertools = "0.12"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
arboard = "=3.3.0"
midir = { version = "0.9", optional = true }
tokio = { version = "1.35", features = ["full"] }

[features]
default = []
midi = ["dep:midir"]
